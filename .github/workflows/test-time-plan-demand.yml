name: Temporary Time Plan Demand E2E
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-time-plan-demand.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test demand persistence
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://n8n-pi.taild8d05f.ts.net/webhook'
          ADMIN='ddf7f787-8a08-4606-ac52-a8888f7dac42'
          DATE='2026-09-13'
          PROCESS='process-test-08'

          echo '1. Save day demand = 40'
          curl --fail-with-body -sS -X POST "$BASE/workplan-time-plan-save" \
            --data-urlencode 'action=demandDay' \
            --data-urlencode "requestedBy=$ADMIN" \
            --data-urlencode "date=$DATE" \
            --data-urlencode "processId=$PROCESS" \
            --data-urlencode 'requiredSkillId=' \
            --data-urlencode 'totalHours=40' \
            --data-urlencode 'defaultHoursPerPerson=8' | tee /tmp/day.json

          echo '\n2. Save shifts = 24/16/0/0'
          curl --fail-with-body -sS -X POST "$BASE/workplan-time-plan-save" \
            --data-urlencode 'action=demandShifts' \
            --data-urlencode "requestedBy=$ADMIN" \
            --data-urlencode "date=$DATE" \
            --data-urlencode "processId=$PROCESS" \
            --data-urlencode 'requiredSkillId=' \
            --data-urlencode 'shiftHours=[{"shiftNo":1,"requiredHours":24},{"shiftNo":2,"requiredHours":16},{"shiftNo":3,"requiredHours":0},{"shiftNo":4,"requiredHours":0}]' | tee /tmp/shifts.json

          echo '\n3. Read view before assigning person'
          curl --fail-with-body -sS "$BASE/workplan-time-plan?date=$DATE" > /tmp/view-before.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/view-before.json'))
          p=next(x for x in d['demand'] if x['processId']=='process-test-08')
          parts={int(x['shiftNo']):float(x['requiredHours']) for x in p['shiftParts']}
          print('before',p['totalHours'],parts)
          assert float(p['totalHours'])==40
          assert parts.get(1)==24 and parts.get(2)==16 and parts.get(3)==0 and parts.get(4)==0
          PY

          echo '4. Assign test employee 030 to shift 1'
          curl --fail-with-body -sS -X POST "$BASE/workplan-time-plan-save" \
            --data-urlencode 'action=bulkPlan' \
            --data-urlencode "requestedBy=$ADMIN" \
            --data-urlencode "date=$DATE" \
            --data-urlencode 'userIds=["workplan-test-030"]' \
            --data-urlencode "processId=$PROCESS" \
            --data-urlencode 'shiftNo=1' \
            --data-urlencode 'startTime=06:00' \
            --data-urlencode 'endTime=14:00' \
            --data-urlencode 'status=active' | tee /tmp/plan.json

          echo '\n5. Read view after assignment — demand must be unchanged'
          curl --fail-with-body -sS "$BASE/workplan-time-plan?date=$DATE" > /tmp/view-after.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/view-after.json'))
          p=next(x for x in d['demand'] if x['processId']=='process-test-08')
          parts={int(x['shiftNo']):float(x['requiredHours']) for x in p['shiftParts']}
          print('after assignment',p['totalHours'],parts,'assignedHours=',p['assignedHours'])
          assert float(p['totalHours'])==40
          assert parts.get(1)==24 and parts.get(2)==16 and parts.get(3)==0 and parts.get(4)==0
          PY

          echo '6. Cancel test employee 030'
          curl --fail-with-body -sS -X POST "$BASE/workplan-time-plan-save" \
            --data-urlencode 'action=plan' \
            --data-urlencode "requestedBy=$ADMIN" \
            --data-urlencode "date=$DATE" \
            --data-urlencode 'userId=workplan-test-030' \
            --data-urlencode "processId=$PROCESS" \
            --data-urlencode 'shiftNo=1' \
            --data-urlencode 'startTime=06:00' \
            --data-urlencode 'endTime=14:00' \
            --data-urlencode 'status=cancelled' | tee /tmp/cancel.json

          echo '\n7. Read view after cancel — demand must still be unchanged'
          curl --fail-with-body -sS "$BASE/workplan-time-plan?date=$DATE" > /tmp/view-final.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/view-final.json'))
          p=next(x for x in d['demand'] if x['processId']=='process-test-08')
          parts={int(x['shiftNo']):float(x['requiredHours']) for x in p['shiftParts']}
          print('after cancel',p['totalHours'],parts)
          assert float(p['totalHours'])==40
          assert parts.get(1)==24 and parts.get(2)==16 and parts.get(3)==0 and parts.get(4)==0
          print('E2E PASS')
          PY
