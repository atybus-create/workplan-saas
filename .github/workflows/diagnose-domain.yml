name: Diagnose custom domain
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check frontend DNS and HTTPS
        run: |
          echo '=== frontend DNS ==='
          getent ahosts workplan.atybuslab.com || true
          echo '=== frontend headers ==='
          curl -sS -I --max-time 20 https://workplan.atybuslab.com/ || true
          echo '=== backend DNS ==='
          getent ahosts n8n-pi.taild8d05f.ts.net || true
          echo '=== backend headers ==='
          curl -sS -I --max-time 20 https://n8n-pi.taild8d05f.ts.net/webhook/workplan-auth-login || true
