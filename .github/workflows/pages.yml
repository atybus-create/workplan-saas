name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend JavaScript
        shell: bash
        run: |
          set -e
          for file in *.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Normalize navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = (
              'start.html',
              'employees.html',
              'skills.html',
              'process-hub.html',
              'time-plan.html',
              'day-plan.html',
          )

          items = (
              ('start.html', '⌂', 'Start'),
              ('employees.html', '◎', 'Pracownicy'),
              ('skills.html', '◆', 'Skill Hub'),
              ('process-hub.html', '▧', 'Proces Hub'),
              ('time-plan.html', '◷', 'Plan pracy'),
              ('day-plan.html', '▤', 'Plan dnia'),
          )

          for name in pages:
              path = Path(name)
              if not path.exists():
                  continue

              text = path.read_text(encoding='utf-8')
              links = []
              for href, icon, label in items:
                  active = ' active' if href == name else ''
                  links.append(
                      f'        <a class="nav-item{active}" href="{href}"><span class="nav-icon">{icon}</span><span>{label}</span></a>'
                  )

              nav = '<nav class="main-nav" aria-label="Główna nawigacja">\n' + '\n'.join(links) + '\n      </nav>'
              text, replaced = re.subn(
                  r'<nav\b[^>]*class="main-nav"[^>]*>.*?</nav>',
                  nav,
                  text,
                  count=1,
                  flags=re.S,
              )

              if replaced != 1:
                  raise RuntimeError(f'Nie znaleziono głównej nawigacji w {name}')

              text = re.sub(
                  r'\s*<div class="sidebar-bottom">.*?</div>',
                  '',
                  text,
                  count=1,
                  flags=re.S,
              )

              path.write_text(text, encoding='utf-8')
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
