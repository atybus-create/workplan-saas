name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build navigation
        shell: python
        run: |
          from pathlib import Path
          skill_link = '<a class="nav-item" href="skills.html"><span class="nav-icon">◆</span><span>Skill Hub</span></a>'
          process_link = '<a class="nav-item" href="process-hub.html"><span class="nav-icon">▧</span><span>Proces Hub</span></a>'
          time_link = '<a class="nav-item" href="time-plan.html"><span class="nav-icon">◷</span><span>Plan pracy</span></a>'
          marker = '<button class="nav-item" type="button" disabled><span class="nav-icon">◇</span><span>Obszary pracy</span></button>'
          for name in ('start.html', 'employees.html', 'skills.html', 'process-hub.html', 'time-plan.html'):
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if 'href="skills.html"' not in text:
                  text = text.replace(marker, skill_link + '\n        ' + marker, 1)
              if 'href="process-hub.html"' not in text:
                  lines = text.splitlines()
                  time_index = next((i for i, line in enumerate(lines) if 'href="time-plan.html"' in line), None)
                  if time_index is not None:
                      indent = lines[time_index][:len(lines[time_index]) - len(lines[time_index].lstrip())]
                      lines.insert(time_index, indent + process_link)
                      text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
                  else:
                      text = text.replace(marker, process_link + '\n        ' + marker, 1)
              if 'href="time-plan.html"' not in text:
                  text = text.replace(marker, time_link + '\n        ' + marker, 1)
              p.write_text(text, encoding='utf-8')
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
